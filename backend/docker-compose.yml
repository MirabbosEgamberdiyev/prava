services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: prava-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-prava_online_db}
      POSTGRES_USER: ${DB_USERNAME:-prava_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prava_password}
    # SECURITY: avval "5432:5432" edi — Postgres BUTUN internetga ochilgan edi
    # (git'dagi ma'lum parol bilan). Endi faqat localhost'ga bind qilinadi;
    # app konteyneri baribir `prava-network` orqali ulanadi, port publish shart emas.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prava_user -d prava_online_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prava-network

  # Spring Boot Application
  app:
    container_name: prava-online
    build: .
    image: prava-online:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Database connection
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-prava_online_db}
      DB_USERNAME: ${DB_USERNAME:-prava_user}
      DB_PASSWORD: ${DB_PASSWORD:-prava_password}
      SPRING_PROFILES_ACTIVE: prod

      # SECURITY: JWT_SECRET default'i OLIB TASHLANDI. `${JWT_SECRET:?...}` —
      # agar .env da berilmasa `docker compose up` xato bilan to'xtaydi.
      # Avvalgi hardcoded default git'da ochiq edi → to'liq auth bypass imkoni.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env faylda majburiy (openssl rand -base64 48)}

      # CORS — production domains
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://pravaonline.uz,https://www.pravaonline.uz,https://admin.pravaonline.uz}

      # OAuth & Mail (optional - app will work without these)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}

      # Telegram Bot — token faqat .env dan (hardcoded default olib tashlandi)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-pravaonlineuzbot}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://pravaonline.uz/api/v1/telegram/webhook}

      # Default admin bootstrap parollari — kodda endi default YO'Q.
      # Agar bular bo'sh bo'lsa, DefaultUserInitializer default adminlarni
      # umuman yaratmaydi (ma'lum parolli admin akkaunt paydo bo'lmasligi uchun).
      APP_INIT_SUPER_ADMIN_PASSWORD: ${APP_INIT_SUPER_ADMIN_PASSWORD:-}
      APP_INIT_ADMIN_PASSWORD: ${APP_INIT_ADMIN_PASSWORD:-}
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      # ✅ FIXED: Use curl instead of wget + correct endpoint
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prava-network

volumes:
  postgres_data:
    external: true
    name: prava-online_postgres_data
  app_uploads:
    external: true
    name: prava-online_app_uploads
  app_logs:
    external: true
    name: prava-online_app_logs

networks:
  prava-network:
    driver: bridge