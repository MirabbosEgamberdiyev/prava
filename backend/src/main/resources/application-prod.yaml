spring:
  datasource:
    # SECURITY / AUDIT: DB kredensiallari endi env orqali override qilinadi.
    # ⚠️ DIQQAT: `prava_password` default'i faqat mavjud deploy'ni buzmaslik uchun
    #    vaqtincha qoldirildi — u git'da ochiq turgan, ya'ni KOMPROMETATSIYA
    #    QILINGAN parol hisoblanadi. Serverdagi .env ga DB_PASSWORD qo'shib,
    #    parolni almashtirgandan keyin bu default'ni butunlay olib tashlang
    #    (`password: ${DB_PASSWORD}`), shunda fail-fast bo'ladi.
    url: ${DB_URL:jdbc:postgresql://postgres:5432/prava_online_db}
    username: ${DB_USERNAME:prava_user}
    password: ${DB_PASSWORD:prava_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # ✅ CRITICAL: 'update' - yangi columnlar qo'shadi, lekin HECH NARSANI O'CHIRMAYDI
      # ❌ 'create' - har safar ma'lumotlarni o'chiradi (HECH QACHON ishlatmang!)
      # ❌ 'create-drop' - to'xtaganda ham o'chiradi (HECH QACHON ishlatmang!)
      # ✅ 'validate' - faqat tekshiradi, o'zgartirmaydi (eng xavfsiz, lekin yangi field qo'shib bo'lmaydi)
      # ✅ 'update' - yangi qo'shadi, mavjudni saqlab qoladi (TAVSIYA ETILADI)
      #
      # ⚠️ AUDIT B5: Flyway (validate-on-migrate:true, pastda) HAM yoqiq — ya'ni schema
      # ikki mexanizm orqali boshqarilmoqda (drift xavfi). Maqsad: 'validate'ga o'tish,
      # lekin buni staging'da avval sinab ko'rmasdan qilib bo'lmaydi — agar hozirgi prod
      # DB biror joyda entity'lardan farq qilsa, 'validate' keyingi deploy'ni CRASH qiladi.
      # Qadam: staging DB'da spring.profiles.active=prod,SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      # bilan sinab ko'ring; xato chiqmasa, shu yerda ddl-auto:validate ga o'zgartiring.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF

server:
  port: 8080
  # SECURITY: application.yaml'da `include-message: always` va
  # `include-binding-errors: always` turibdi — bu production'da Spring'ning ichki
  # xato matnlarini (SQL/entity/class nomlari) klientga oshkor qiladi.
  # Prod profilida hammasi o'chiriladi; foydalanuvchiga tushunarli xabarlar
  # GlobalExceptionHandler orqali i18n bilan qaytariladi.
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

app:
  # SECURITY: JWT secret — default YO'Q, majburiy env (fail-fast).
  # Avvalgi default git'da ochiq turardi: uni bilgan har kim ixtiyoriy
  # foydalanuvchi (jumladan SUPER_ADMIN) nomidan token imzolay olardi.
  jwt:
    secret: ${JWT_SECRET}

  verification:
    test-mode:
      enabled: false
      default-code: "123456"

  sms:
    enabled: true
    test-mode:
      log-only: false

  email:
    enabled: true
    test-mode:
      log-only: false

  # Production CORS — faqat real domains
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,https://pravaonline.uz,https://www.pravaonline.uz,https://admin.pravaonline.uz}
    oauth:
      google:
        enabled: true

  # Telegram Bot — env variable orqali
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:8485868847:AAGR9eBV1qibgJfXHpqZ04JlbyrjemaTrGA}
    bot-username: ${TELEGRAM_BOT_USERNAME:pravaonlineuzbot}
    webhook-url: ${TELEGRAM_WEBHOOK_URL:https://pravaonline.uz/api/v1/telegram/webhook}
    base-url: ${TELEGRAM_BASE_URL:https://pravaonline.uz}

  storage:
    local:
      enabled: true
      path: /app/uploads

  default-users:
    enabled: true

  # =========================================================
  # Payment module — Click & Payme
  # Fill secrets via .env (CLICK_*, PAYME_*)
  # =========================================================
  payment:
    enabled: true
    frontend-base-url: ${PAYMENT_FRONTEND_BASE_URL:https://pravaonline.uz}
    access-days:                           # blank = lifetime; e.g. 365 = 1 year
    pending-timeout-minutes: 30
    sweeper-delay-ms: 300000
    sweeper-initial-delay-ms: 60000

    click:
      enabled: true
      service-id:       ${CLICK_SERVICE_ID:}
      merchant-id:      ${CLICK_MERCHANT_ID:}
      merchant-user-id: ${CLICK_MERCHANT_USER_ID:}
      secret-key:       ${CLICK_SECRET_KEY:}
      checkout-url:     https://my.click.uz/services/pay
      return-path:      /payment/success

    payme:
      enabled: true
      merchant-id:       ${PAYME_MERCHANT_ID:}
      cashbox-key:       ${PAYME_CASHBOX_KEY:}
      test-cashbox-key:  ${PAYME_TEST_CASHBOX_KEY:}
      checkout-base-url: https://checkout.paycom.uz
      return-path:       /payment/success
      timeout-seconds:   43200

# SECURITY: Swagger/OpenAPI production'da O'CHIRILADI.
# SecurityConfig'da `/swagger-ui/**`, `/v3/api-docs/**`, `/api-docs/**`
# permitAll qilingan — ya'ni prod'da butun API sxemasi (barcha admin
# endpointlar, parametrlar, DTO'lar) autentifikatsiyasiz ochiq edi.
# Bu hujumchi uchun tayyor xarita. Dev/staging'da baribir yoqiq qoladi.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    enabled-by-default: true
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: when-authorized
      probes:
        enabled: true
  server:
    port: 8080