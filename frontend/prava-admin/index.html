<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="PravaOnline Admin" />
    <meta property="og:description" content="PravaOnline Admin Panel" />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:type" content="website" />

    <!-- Shrift: render-blocking @import o'rniga preconnect + display=swap (FOIT yo'q) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    />

    <title>PravaOnline Admin</title>

    <!--
      Mantine ColorSchemeScript: JS bundle yuklanguncha data-mantine-color-scheme
      atributini o'rnatadi. Busiz defaultColorScheme="dark" bo'lsa ham sahifa
      avval oq bo'lib "chaqnaydi" (FOUC).
    -->
    <script data-mantine-script>
      try {
        var _colorScheme = window.localStorage.getItem("mantine-color-scheme-value");
        var colorScheme =
          _colorScheme === "light" || _colorScheme === "dark" || _colorScheme === "auto"
            ? _colorScheme
            : "dark";
        var computedColorScheme =
          colorScheme !== "auto"
            ? colorScheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-mantine-color-scheme", computedColorScheme);

        // Pre-render Universal Accessibility & Typography attributes (Zero-Flicker)
        var typoRaw = window.localStorage.getItem("prava_typography_settings") || window.localStorage.getItem("prava_accessibility_preferences");
        if (typoRaw) {
          var typo = JSON.parse(typoRaw);
          var textSize = typo.textSize || (typo.fontScale === "xs" || typo.fontScale === "sm" ? "small" : typo.fontScale === "lg" || typo.fontScale === "xl" || typo.fontScale === "xxl" ? "large" : "normal");
          var isBold = typo.boldText !== undefined ? Boolean(typo.boldText) : typo.fontWeight === "bold";

          document.documentElement.setAttribute("data-text-size", textSize);
          document.documentElement.setAttribute("data-bold-text", String(isBold));

          var scaleVal = textSize === "small" ? "0.9" : textSize === "large" ? "1.15" : "1.0";
          document.documentElement.style.setProperty("--user-font-scale", scaleVal);
          document.documentElement.style.setProperty("--font-scale", scaleVal);

          // Backward compatibility
          document.documentElement.setAttribute("data-font-scale", textSize === "small" ? "sm" : textSize === "large" ? "lg" : "md");
          document.documentElement.setAttribute("data-font-weight", isBold ? "bold" : "normal");
          if (typo.lineHeight) document.documentElement.setAttribute("data-line-height", typo.lineHeight);
          if (typo.letterSpacing) document.documentElement.setAttribute("data-letter-spacing", typo.letterSpacing);
          if (typo.fontFamily) document.documentElement.setAttribute("data-font-family", typo.fontFamily);
          if (typo.contrast) document.documentElement.setAttribute("data-contrast", typo.contrast);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
