# ==============================================================================
# PRAVA ONLINE — NGINX DUAL DOMAIN CONFIGURATION
#
# 1. https://pravaonline.uz      -> Public Landing & Marketing Website
# 2. https://web.pravaonline.uz  -> Full Web Application
#
# Talab: /etc/nginx/snippets/prava-security-headers.conf
#   (sudo cp snippets/prava-security-headers.conf /etc/nginx/snippets/)
#
# MUHIM (P1-W3): nginx `add_header` ni ota blokdan meros qilmaydi, agar
# location o'zining `add_header` iga ega bo'lsa. Shuning uchun security
# header'lar server darajasida VA o'z add_header'i bor har bir location
# ichida qayta qo'yiladi.
# ==============================================================================

# Content-Security-Policy — hozircha faqat REPORT-ONLY (bloklamaydi).
# Brauzer konsolidagi buzilishlarni ~1 hafta kuzatib, keyin
# `Content-Security-Policy` sifatida yoqish mumkin.
# sha256 — index.html dagi ikki inline <script> (tema/til bootstrap) xeshlari;
# index.html inline skriptlari o'zgarsa, xeshlarni yangilang.
map $host $prava_web_csp_report_only {
    default "default-src 'self'; script-src 'self' 'sha256-3lYNWX5fjZpkOj8eX86mIYpZRGzejjrHv6blajzg7/U=' 'sha256-Iw5TnRxIxdbimPA/xnhajGGayLbkYUdGxBCqQZLJC/s=' https://accounts.google.com https://telegram.org https://oauth.telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://pravaonline.uz https://web.pravaonline.uz https://accounts.google.com; frame-src https://accounts.google.com https://oauth.telegram.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# ──────────────────────────────────────────────────────────────────────────────
# 1. PUBLIC LANDING / PUBLIC WEBSITE (pravaonline.uz, www.pravaonline.uz)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name pravaonline.uz www.pravaonline.uz;

    root /var/www/pravaonline.uz;
    index index.html;

    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # Static asset caching (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/prava-security-headers.conf;
        add_header Content-Security-Policy-Report-Only $prava_web_csp_report_only always;
    }

    # i18n translation files — NEVER cache
    location ~* ^/locales/.*\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/snippets/prava-security-headers.conf;
        add_header Content-Security-Policy-Report-Only $prava_web_csp_report_only always;
        try_files $uri =404;
    }

    # ── Redirect Web App & Auth routes to web.pravaonline.uz ──────────────────
    # Preserves full request URI including query params (?sessionId=...&challenge=... or ?token=...)
    # (/|$) anchor: avval anchor yo'q edi va /media/, /exam-centers ham ushlanardi (P1-W8)
    location ~* ^/(me|tickets|packages|topics|exam|marafon|wrong-answers|wrong-exam|saved-questions|statistics|history|leaderboard|settings|payment|admin)(/|$) {
        return 302 https://web.pravaonline.uz$request_uri;
    }

    location ^~ /auth/ {
        return 302 https://web.pravaonline.uz$request_uri;
    }

    # ── Installer download — katta fayl streaming ─────────────────────────────
    location /api/v1/files/installers/ {
        proxy_pass http://127.0.0.1:8080/api/v1/files/installers/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_buffering       off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # ── Media URL larni backendga yo'naltirish ────────────────────────────────
    location ^~ /media/ {
        proxy_pass         http://127.0.0.1:8080/api/v1/files/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (X-XSS-Protection olib tashlandi — eskirgan, zararli bo'lishi mumkin)
    include /etc/nginx/snippets/prava-security-headers.conf;
    add_header Content-Security-Policy-Report-Only $prava_web_csp_report_only always;

    # Logging
    access_log /var/log/nginx/prava-landing.access.log;
    error_log  /var/log/nginx/prava-landing.error.log;
}

# ──────────────────────────────────────────────────────────────────────────────
# 2. FULL WEB APPLICATION (web.pravaonline.uz)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name web.pravaonline.uz;

    # Can share dist or point to web app deployment directory
    root /var/www/web.pravaonline.uz;
    index index.html;

    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # Static asset caching (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/prava-security-headers.conf;
        add_header Content-Security-Policy-Report-Only $prava_web_csp_report_only always;
    }

    # i18n translation files — NEVER cache
    location ~* ^/locales/.*\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/snippets/prava-security-headers.conf;
        add_header Content-Security-Policy-Report-Only $prava_web_csp_report_only always;
        try_files $uri =404;
    }

    # ── Redirect marketing pages to https://pravaonline.uz ───────────────────
    location ~* ^/(partners|pricing|downloads|about|contact|faq|terms|privacy)$ {
        return 302 https://pravaonline.uz$request_uri;
    }

    # ── Media URL larni backendga yo'naltirish ────────────────────────────────
    location ^~ /media/ {
        proxy_pass         http://127.0.0.1:8080/api/v1/files/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (X-XSS-Protection olib tashlandi — eskirgan, zararli bo'lishi mumkin)
    include /etc/nginx/snippets/prava-security-headers.conf;
    add_header Content-Security-Policy-Report-Only $prava_web_csp_report_only always;

    # Logging
    access_log /var/log/nginx/prava-web.access.log;
    error_log  /var/log/nginx/prava-web.error.log;
}
