# ==============================================================================
# PRAVA ONLINE — NGINX DUAL DOMAIN CONFIGURATION
#
# 1. https://pravaonline.uz      -> Public Landing & Marketing Website
# 2. https://web.pravaonline.uz  -> Full Web Application
# ==============================================================================

# ──────────────────────────────────────────────────────────────────────────────
# 1. PUBLIC LANDING / PUBLIC WEBSITE (pravaonline.uz, www.pravaonline.uz)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name pravaonline.uz www.pravaonline.uz;

    root /var/www/pravaonline.uz;
    index index.html;

    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # Static asset caching (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # i18n translation files — NEVER cache
    location ~* ^/locales/.*\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # ── Redirect Web App & Auth routes to web.pravaonline.uz ──────────────────
    # Preserves full request URI including query params (?sessionId=...&challenge=... or ?token=...)
    location ~* ^/(me|tickets|packages|topics|exam|marafon|wrong-answers|wrong-exam|saved-questions|statistics|history|leaderboard|settings|payment|admin) {
        return 302 https://web.pravaonline.uz$request_uri;
    }

    location ^~ /auth/ {
        return 302 https://web.pravaonline.uz$request_uri;
    }

    # ── Installer download — katta fayl streaming ─────────────────────────────
    location /api/v1/files/installers/ {
        proxy_pass http://127.0.0.1:8080/api/v1/files/installers/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_buffering       off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # ── Media URL larni backendga yo'naltirish ────────────────────────────────
    location /media/ {
        proxy_pass         http://127.0.0.1:8080/api/v1/files/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options      "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"  always;
    add_header X-XSS-Protection     "1; mode=block" always;
    add_header Referrer-Policy      "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/prava-landing.access.log;
    error_log  /var/log/nginx/prava-landing.error.log;
}

# ──────────────────────────────────────────────────────────────────────────────
# 2. FULL WEB APPLICATION (web.pravaonline.uz)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name web.pravaonline.uz;

    # Can share dist or point to web app deployment directory
    root /var/www/web.pravaonline.uz;
    index index.html;

    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # Static asset caching (Vite hashed filenames)
    location /assets/ {
