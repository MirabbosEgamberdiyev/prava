server {
    listen 80;
    server_name _;

    root /var/www/prava-test;
    index index.html;

    # Foydalanuvchi faqat kichik so'rovlar yuboradi (download fayllar backend tomonidan)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # Static asset caching (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Installer download — katta fayl (1GB) streaming ──────────────────────
    location /api/v1/files/installers/ {
        proxy_pass http://127.0.0.1:8080/api/v1/files/installers/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Bufer o'chirilgan — 1GB fayl nginx xotirasiga yuklanmaydi
        proxy_buffering       off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # ── Eski media URL larni backendga yo'naltirish ───────────────────────────
    location /media/ {
        proxy_pass         http://127.0.0.1:8080/api/v1/files/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options      "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"  always;
    add_header X-XSS-Protection     "1; mode=block" always;
    add_header Referrer-Policy      "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/prava-test.access.log;
    error_log  /var/log/nginx/prava-test.error.log;
}
