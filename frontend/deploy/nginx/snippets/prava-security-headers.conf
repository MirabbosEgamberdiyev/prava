# Umumiy security header'lar — /etc/nginx/snippets/prava-security-headers.conf
#
# MUHIM: nginx `add_header` ni ota blokdan meros qilmaydi, agar location o'zining
# `add_header` iga ega bo'lsa. Shuning uchun bu snippet server darajasida VA
# o'z add_header'i bor har bir location ichida include qilinadi.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
