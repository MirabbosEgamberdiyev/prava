# ══════════════════════════════════════════════════════════════════════════════
# prava-admin — admin.pravaonline.uz
#
# SECURITY (audit P0-7): avval admin panel `listen 8081; server_name _;` bilan
# bare IP orqali, HTTP'da, hammaga ochiq edi (parol va JWT ochiq matnda).
# Endi: alohida domen + TLS (certbot) + IP allowlist + Basic Auth.
#
# O'rnatish:
#   1) DNS: admin.pravaonline.uz → server IP
#   2) sudo cp snippets/prava-security-headers.conf /etc/nginx/snippets/
#      sudo cp snippets/prava-admin-access.conf.example /etc/nginx/snippets/prava-admin-access.conf
#      (IP'larni tahrirlang, htpasswd yarating)
#   3) sudo certbot --nginx -d admin.pravaonline.uz --redirect
#      (certbot 443 blokini va HTTP→HTTPS redirect'ni qo'shadi)
#   4) sudo ufw delete allow 8081/tcp
#   (admin build'ida VITE_API_URL bo'sh — API nisbiy /api/ orqali shu host'dan chaqiriladi)
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name admin.pravaonline.uz;

    root /var/www/prava-admin;
    index index.html;

    include /etc/nginx/snippets/prava-admin-access.conf;
    include /etc/nginx/snippets/prava-security-headers.conf;

    # ── Installer + Backup upload uchun global limit ─────────────────────────
    client_max_body_size 1100M;
    client_body_timeout  900s;
    client_header_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static asset caching (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/prava-security-headers.conf;
    }

    # i18n translation files — NEVER cache
    location ~* ^/locales/.*\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/prava-security-headers.conf;
        try_files $uri =404;
    }

    # ── Installer UPLOAD (1GB) + Backup IMPORT (1GB) — streaming ────────────
    location ~ ^/api/v1/admin/(app-releases/(quick-upload|chunk-(init|upload|complete)|[0-9]+/(upload|quick-update|chunk-complete))|backup/import)$ {
        auth_basic off;   # Bearer token ishlatiladi
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_request_buffering  off;
        proxy_buffering          off;
        proxy_connect_timeout    60s;
        proxy_send_timeout       900s;
        proxy_read_timeout       900s;
        send_timeout             900s;
    }

    # ── Backup EXPORT download — streaming ──────────────────────────────────
    # (audit P0-8: avval bu yo'l installers katalogiga noto'g'ri map qilingan edi)
    location ~ ^/api/v1/admin/backup/export/[^/]+/download$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering       off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── Media URL larni backendga yo'naltirish ───────────────────────────────
    location /media/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080/api/v1/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API proxy (backend 8080 portda) ─────────────────────────────────────
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # SPA fallback — index.html hech qachon keshlanmaydi (yangi deploy darhol ko'rinsin)
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/prava-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/prava-admin.access.log;
    error_log  /var/log/nginx/prava-admin.error.log;
}

# ══════════════════════════════════════════════════════════════════════════════
# Bare IP (default server) — foydalanuvchi ilovasi.
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name _;

    root /var/www/prava-test;
    index index.html;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080/api/v1/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Installer download — streaming ──────────────────────────────────────
    # (audit P0-8: regex location ichida URI'li proxy_pass nginx -t dan o'tmasdi)
    location ^~ /api/v1/files/installers/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_buffering         off;
        proxy_connect_timeout   30s;
        proxy_send_timeout      600s;
        proxy_read_timeout      600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/prava-test.access.log;
    error_log  /var/log/nginx/prava-test.error.log;
}
