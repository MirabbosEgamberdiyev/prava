server {
    listen 8081;
    server_name _;

    root /var/www/prava-admin;
    index index.html;

    # ── Installer upload uchun global limit ──────────────────────────────────
    # AppRelease installer upload: max 500 MB → 550M xavfsizlik uchun
    client_max_body_size 550M;
    client_body_timeout  600s;
    client_header_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static asset caching (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Installer fayl UPLOAD — maxsus sozlamalar ────────────────────────────
    # proxy_request_buffering off: nginx faylni xotiraga yuklamaydi, to'g'ri backendga yuboradi
    location ~ ^/api/v1/admin/app-releases/[0-9]+/upload$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Katta faylni buferlash o'chirilgan — to'g'ri stream
        proxy_request_buffering  off;
        proxy_buffering          off;
        proxy_connect_timeout    60s;
        proxy_send_timeout       600s;
        proxy_read_timeout       600s;
        send_timeout             600s;
    }

    # ── Media URL larni backendga yo'naltirish ───────────────────────────────
    location /media/ {
        proxy_pass http://127.0.0.1:8080/api/v1/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API proxy (backend 8080 portda) ─────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/prava-admin.access.log;
    error_log  /var/log/nginx/prava-admin.error.log;
}

server {
    listen 80;
    server_name _;

    root /var/www/prava-test;
    index index.html;

    # Foydalanuvchi faqat yuklab oladi (upload yo'q) — 50M yetarli
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static asset caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media proxy
    location /media/ {
        proxy_pass http://127.0.0.1:8080/api/v1/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Installer download — katta fayl streami ──────────────────────────────
    location /api/v1/files/installers/ {
        proxy_pass http://127.0.0.1:8080/api/v1/files/installers/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Katta faylni buferlash o'chirilgan
        proxy_buffering         off;
        proxy_connect_timeout   30s;
        proxy_send_timeout      600s;
        proxy_read_timeout      600s;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/prava-test.access.log;
    error_log  /var/log/nginx/prava-test.error.log;
}
