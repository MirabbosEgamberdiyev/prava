    <!--
      Shriftlar: avval `src/index.css` ichida `@import url(fonts.googleapis.com)`
      orqali yuklanardi. `@import` CSS parse qilingandan KEYIN ishga tushadi,
      ya'ni zanjirli (chained) render-blocking so'rov hosil qilardi.
      Bu yerda `media="print" + onload` naqshi bilan bloklamasdan yuklaymiz.
      Faqat 400/500/600/700 og'irliklari — avval 100..900 to'liq variable
      diapazon (normal + italic, 2 fayl) so'ralardi, ammo kodda italic
      umuman ishlatilmaydi.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
