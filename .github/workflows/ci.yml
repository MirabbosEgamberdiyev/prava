name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Sirlar git'ga tushmasligi uchun ──────────────────────────────────────────
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend: unit + integratsion testlar (Testcontainers/PostgreSQL) ──────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & test
        run: mvn -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  # ── Web (foydalanuvchi) ──────────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/prava-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/prava-test/yarn.lock
      # Deploy (auto-deploy.sh) ham aynan shu buyruqni ishlatadi — lockfile mos kelmasa CI'da yiqiladi.
      - run: yarn install --frozen-lockfile
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: node scripts/audit-i18n.cjs
      - run: npx tsx scripts/test-transliterate.mjs
      - run: npx vite build
      - run: node scripts/check-bundle-size.mjs dist

  # ── Admin panel ──────────────────────────────────────────────────────────────
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/prava-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/prava-admin/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx eslint .
      - run: node scripts/audit-i18n.cjs
      - run: npx vite build

  # ── nginx konfiguratsiyalari (audit P0-8: buzilgan config deploy'ni to'xtatgan edi) ──
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t
        run: |
          docker run --rm \
            -v "$PWD/frontend/deploy/nginx/prava-test.conf:/etc/nginx/conf.d/prava-test.conf:ro" \
            -v "$PWD/frontend/deploy/nginx/prava-admin.conf:/etc/nginx/conf.d/prava-admin.conf:ro" \
            -v "$PWD/frontend/deploy/nginx/snippets/prava-security-headers.conf:/etc/nginx/snippets/prava-security-headers.conf:ro" \
            -v "$PWD/frontend/deploy/nginx/snippets/prava-admin-access.conf.example:/etc/nginx/snippets/prava-admin-access.conf:ro" \
            nginx:1.27-alpine sh -c 'rm -f /etc/nginx/conf.d/default.conf && touch /etc/nginx/.htpasswd-prava-admin && nginx -t'

  # ── Docker image build (non-root, healthcheck) ───────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prava-online:ci backend
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id prava-online:ci -u)" != "0"
